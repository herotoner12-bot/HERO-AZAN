name: Build HERO AZAN APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK and accepts its licences (needed to download platform 36)
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unit tests: prayer times vs reference values, qibla bearing, Hijri dates, DST, reminders
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HERO-AZAN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (signed with the debug key)
        uses: actions/upload-artifact@v4
        with:
          name: HERO-AZAN-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          
