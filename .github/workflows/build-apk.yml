name: Build HERO AZAN APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Finds the folder that contains settings.gradle.kts (works whether the project
      # sits in the repo root or inside a sub-folder such as HERO-AZAN/).
      - name: Locate project folder
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Files in repo:"; find . -maxdepth 3 -not -path "./.git/*" | head -100
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK. Only the licences must be accepted so that
      # Gradle can download platform 36 / build-tools by itself.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      # Installs Gradle 8.14.3 itself, so the build does not depend on gradlew /
      # gradle-wrapper.jar being present in the repository.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Unit tests: prayer times vs reference values, qibla bearing, Hijri dates, DST, reminders
      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HERO-AZAN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (signed with the debug key)
        uses: actions/upload-artifact@v4
        with:
          name: HERO-AZAN-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest
